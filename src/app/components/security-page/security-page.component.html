<div class="security-page">

  <!-- Header row: alarm state badge + emergency button -->
  <div class="security-header">
    <div class="alarm-state">
      <span class="alarm-badge" [ngClass]="getAlarmBadgeClass()">
        <i class="fas fa-shield-alt" aria-hidden="true"></i>
        {{ alarmMode | titlecase }}
      </span>
    </div>

    <!-- TODO: [STORY] 911 Emergency Call Integration — button is a placeholder only -->
    <button
      class="btn btn-emergency"
      type="button"
      (click)="onEmergency()"
      title="Emergency — Coming Soon"
      disabled>
      <i class="fas fa-phone" aria-hidden="true"></i>
      Emergency (Coming Soon)
    </button>
  </div>

  <!-- Alarm mode controls -->
  <div class="security-alarm-controls">
    <button
      type="button"
      class="btn alarm-btn"
      [ngClass]="{ 'alarm-btn--active': alarmMode === 'armed' }"
      (click)="setAlarmMode('armed')">
      <i class="fas fa-lock" aria-hidden="true"></i> Armed
    </button>
    <button
      type="button"
      class="btn alarm-btn"
      [ngClass]="{ 'alarm-btn--active': alarmMode === 'away' }"
      (click)="setAlarmMode('away')">
      <i class="fas fa-car" aria-hidden="true"></i> Away
    </button>
    <button
      type="button"
      class="btn alarm-btn"
      [ngClass]="{ 'alarm-btn--active': alarmMode === 'disarmed' }"
      (click)="setAlarmMode('disarmed')">
      <i class="fas fa-lock-open" aria-hidden="true"></i> Disarmed
    </button>
  </div>

  <!-- Camera feeds -->
  <section class="security-section" aria-label="Camera Feeds">
    <h3 class="security-section-title">
      <i class="fas fa-video" aria-hidden="true"></i> Cameras
    </h3>
    <div class="camera-grid">
      <div class="camera-card" *ngFor="let cam of cameras">
        <div class="camera-feed">
          <ng-container *ngIf="cam.streamUrl; else cameraPlaceholder">
            <img [src]="cam.streamUrl" [alt]="cam.name + ' feed'" class="camera-img">
          </ng-container>
          <ng-template #cameraPlaceholder>
            <div class="camera-placeholder">
              <i class="fas fa-video-slash" aria-hidden="true"></i>
              <span>No Signal</span>
            </div>
          </ng-template>
        </div>
        <div class="camera-label">{{ cam.name }}</div>
      </div>
    </div>
  </section>

  <!-- Sensor status -->
  <section class="security-section" aria-label="Sensors">
    <h3 class="security-section-title">
      <i class="fas fa-broadcast-tower" aria-hidden="true"></i> Sensors
    </h3>
    <ul class="sensor-list">
      <li
        class="sensor-item"
        [ngClass]="getSensorStateClass(sensor.state)"
        *ngFor="let sensor of sensors">
        <i class="fas {{ getSensorIcon(sensor.type) }} sensor-icon" aria-hidden="true"></i>
        <span class="sensor-name">{{ sensor.name }}</span>
        <span class="sensor-state">{{ sensor.state | titlecase }}</span>
      </li>
    </ul>
  </section>

</div>
